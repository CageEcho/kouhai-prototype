<title>口骇</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 布局：作品优先的瀑布流社区。赛事是入口条，作品卡片无边框，只有封面与元信息；黄色荧光笔是唯一强调色 */
:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --surface-2:#E6E8EC; --line:#DCDFE5;
  --ink:#15171C; --ink-2:#5A5F6B; --ink-3:#8C919C;
  --accent:#FFD400; --accent-ink:#15171C; --hl:#FFD400; --heat:#D9A300;
  --ok:#1E9A56; --live:#2563EB; --fund:#8A3CD6; --sleep:#8A8F99; --warn:#D9480F;
  --shadow:0 1px 2px rgba(20,22,28,.06),0 8px 24px rgba(20,22,28,.06);
  --f-display:"ZCOOL QingKe HuangYou","Noto Sans SC","PingFang SC",sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1013; --surface:#17191E; --surface-2:#23262D; --line:#2B2E36;
  --ink:#ECEDEF; --ink-2:#A0A5B0; --ink-3:#6E737D;
  --accent:#FFD400; --accent-ink:#15171C; --hl:rgba(255,212,0,.42); --heat:#FFC800;
  --ok:#3CCB7F; --live:#6C97FF; --fund:#B887FF; --sleep:#7D828C; --warn:#FF7A45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1013; --surface:#17191E; --surface-2:#23262D; --line:#2B2E36;
  --ink:#ECEDEF; --ink-2:#A0A5B0; --ink-3:#6E737D;
  --accent:#FFD400; --accent-ink:#15171C; --hl:rgba(255,212,0,.42); --heat:#FFC800;
  --ok:#3CCB7F; --live:#6C97FF; --fund:#B887FF; --sleep:#7D828C; --warn:#FF7A45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.wrap{max-width:1320px;margin:0 auto;padding-inline:clamp(16px,3vw,32px)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.ribbon{background:var(--ink);color:var(--bg);font-size:12px;text-align:center;padding:6px 16px;letter-spacing:.02em}
.ribbon b{color:var(--accent);font-weight:700}

/* 导航 */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:20px;height:64px}
.logo{font-family:var(--f-display);font-size:30px;line-height:1;display:flex;align-items:center;gap:2px;text-decoration:none;flex:none}
.logo b{font-weight:400;background:var(--accent);color:var(--accent-ink);padding:3px 6px 1px;border-radius:5px;transform:rotate(-5deg);display:inline-block;margin-right:3px}
.logo small{font-family:var(--f-mono);font-size:10px;color:var(--ink-3);margin-left:8px;letter-spacing:.08em;align-self:flex-end;padding-bottom:3px}
.nav-links{display:flex;gap:2px}
.nav-links a{text-decoration:none;padding:8px 12px;border-radius:8px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.nav-links a:hover{color:var(--ink);background:var(--surface-2)}
.nav-links a.on{color:var(--ink);font-weight:700;background:var(--surface)}
.search{flex:1;max-width:380px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:40px;margin-left:auto;color:var(--ink-3)}
.search:focus-within{border-color:var(--ink)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit}
.search input::placeholder{color:var(--ink-3)}
.nav-right{display:flex;align-items:center;gap:10px;flex:none}

.btn{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .12s,background .15s}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:scale(.97)}
.btn-y{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-y:hover{border-color:var(--accent);filter:brightness(.97)}
.btn-ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn-ink:hover{border-color:var(--ink);opacity:.9}
.btn-sm{height:32px;padding:0 12px;font-size:13px}
.btn-block{width:100%}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.on .ic.heart{fill:var(--accent);stroke:var(--accent)}
.btn-y.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.av{--c:#FFB800;display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--c);color:#15171C;font-weight:700;font-size:15px;flex:none;text-decoration:none}
.av.sm{width:22px;height:22px;font-size:11px}
.av.ghost{background:var(--surface-2);color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--ink-3)}
.av.md{width:44px;height:44px;font-size:18px}
.av.xl{width:112px;height:112px;font-size:46px;box-shadow:0 0 0 5px var(--bg)}

/* 首页 */
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:end;padding-block:44px 28px}
.intro h1{font-family:var(--f-display);font-weight:400;font-size:clamp(38px,5.4vw,68px);line-height:1.08;letter-spacing:.01em}
.hl{background:linear-gradient(transparent 56%,var(--hl) 56%,var(--hl) 90%,transparent 90%);padding-inline:2px}
.intro p.lede{margin-top:14px;color:var(--ink-2);font-size:16px;max-width:36em}
.pulse{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:2px solid var(--ink)}
.pulse div{padding:12px 12px 0 0}
.pulse b{display:block;font-family:var(--f-mono);font-size:clamp(22px,2.6vw,32px);font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.pulse span{color:var(--ink-2);font-size:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:14px}
.sec-h h2{font-size:18px;font-weight:700}
.sec-h .sub{color:var(--ink-2);font-size:13px;margin-left:10px;font-weight:400}
.more{color:var(--ink-2);text-decoration:none;font-size:13px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.more:hover{color:var(--ink)}

.radar{padding-block:8px 36px}
.radar-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:thin}
.rc{scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.rc:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.rc canvas{display:block;width:100%;aspect-ratio:16/8;max-width:100%}
.rc-b{padding:12px 14px 14px;display:grid;gap:6px}
.rc-b h3{font-size:15px;font-weight:700;line-height:1.35}
.rc-meta{color:var(--ink-2);font-size:12px;display:flex;gap:10px;flex-wrap:wrap}
.rc-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.prize{font-family:var(--f-mono);font-weight:600;font-size:13px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--ink)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--ink-3))}
.pill.open{--c:var(--ok)} .pill.live{--c:var(--warn)} .pill.soon{--c:var(--live)} .pill.ended{--c:var(--sleep);color:var(--ink-2)}
.pill.live i{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}

.feed{padding-block:4px 64px}
.feed-head{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:10;background:var(--bg);padding-top:6px;margin-bottom:20px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{padding:12px 14px 10px;font-weight:600;color:var(--ink-2);background:none;border:0;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-size:15px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tab .n{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);margin-left:4px;font-weight:400}
.chips{display:flex;gap:8px;padding-block:12px;overflow-x:auto;scrollbar-width:none}
.chip{padding:5px 13px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink-2);font-size:13px;cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--ink);border-color:var(--ink-3)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px dashed var(--ink-3);border-radius:12px;padding:12px 16px;margin-bottom:20px;color:var(--ink-2)}
.note b{color:var(--ink)}

.masonry{columns:250px 5;column-gap:22px}
.card{break-inside:avoid;display:block;text-decoration:none;margin-bottom:26px}
.cover{position:relative;aspect-ratio:var(--ar,4/3);max-width:100%;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.cover canvas{display:block;width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card:hover .cover canvas{transform:scale(1.035)}
.st{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.st i,.stx i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.st-iterating{--c:var(--ok)} .st-launched{--c:var(--live)} .st-funded{--c:var(--fund)} .st-sleeping{--c:var(--sleep)} .st-unclaimed{--c:var(--warn)}
.st-iterating i{animation:blink 2s infinite}
.award{position:absolute;right:10px;bottom:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:800;padding:3px 9px;border-radius:4px;transform:rotate(-3deg);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.c-meta{padding:10px 2px 0;display:grid;gap:4px}
.c-meta h3{font-size:15px;font-weight:700;line-height:1.35}
.c-ev{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.who{display:inline-flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nums{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:11.5px;flex:none}
.nums .ic{width:13px;height:13px}
.nums .sp{width:6px}
.eye-n{display:inline-flex;gap:4px;align-items:center}
.empty{padding:56px 16px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:14px}

/* 作品详情 */
.crumb{display:flex;gap:8px;flex-wrap:wrap;color:var(--ink-3);font-size:13px;padding-block:20px 16px}
.crumb a{text-decoration:none;color:var(--ink-2)}
.crumb a:hover{color:var(--ink)}
.d-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;column-gap:44px;grid-template-areas:"head side" "body side"}
.d-head{grid-area:head;min-width:0}
.d-body{grid-area:body;min-width:0}
.d-side{grid-area:side;min-width:0}
.d-side-in{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:grid;gap:14px}
.d-cover{border-radius:14px;overflow:hidden;aspect-ratio:16/10;max-width:100%;background:var(--surface-2)}
.d-cover canvas{display:block;width:100%;height:100%}
.d-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:24px}
.d-title h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,4vw,48px);line-height:1.1}
.stx{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.d-tag{font-size:18px;color:var(--ink-2);margin-top:8px;max-width:38em}
.d-body section{padding-top:36px}
.d-body h2{font-size:17px;font-weight:700;margin-bottom:14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.d-body h2 small{font-weight:400;color:var(--ink-3);font-size:13px}
.prose{display:grid;gap:18px;max-width:42em}
.prose h4{margin:0 0 4px;font-size:12px;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.prose p{font-size:15.5px;line-height:1.8}

.life{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.life-stats{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:18px}
.life-stats div{display:grid}
.life-stats b{font-family:var(--f-mono);font-size:26px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.life-stats span{font-size:12px;color:var(--ink-2)}
.life-stats .warn b{color:var(--warn)}
.heat-scroll{overflow-x:auto;padding-top:22px;position:relative}
.heat-box{position:relative;min-width:max(100%,var(--min))}
.heat{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.heat i{aspect-ratio:1;border-radius:2px;background:var(--surface-2)}
.heat i.l1,.legend i.l1{background:color-mix(in oklab,var(--heat) 28%,var(--surface-2))}
.heat i.l2,.legend i.l2{background:color-mix(in oklab,var(--heat) 52%,var(--surface-2))}
.heat i.l3,.legend i.l3{background:color-mix(in oklab,var(--heat) 76%,var(--surface-2))}
.heat i.l4,.legend i.l4{background:var(--heat)}
.heat i.fu{background:transparent}
.heat i.ev{box-shadow:inset 0 0 0 1.5px var(--ink)}
.ev-mark{position:absolute;top:-20px;font-size:11px;font-family:var(--f-mono);color:var(--ink);white-space:nowrap;font-weight:600}
.heat-axis{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--ink-3);font-family:var(--f-mono)}
.legend{display:inline-flex;align-items:center;gap:3px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;background:var(--surface-2)}
.tl{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:0;border-top:1px solid var(--line)}
.tl li{display:grid;grid-template-columns:110px 14px minmax(0,1fr);gap:12px;align-items:start;padding-top:12px;position:relative}
.tl li .d{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);padding-top:1px}
.tl li .dot{width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--ink);margin-top:5px;position:relative}
.tl li:not(:last-child) .dot::after{content:"";position:absolute;left:2px;top:10px;width:2px;height:28px;background:var(--line)}
.tl li.now .dot{background:var(--accent);border-color:var(--ink)}
.tl li span.t{font-size:14px}
.stack{display:flex;gap:8px;flex-wrap:wrap}
.lic{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--ink-2)}
.lic b{font-family:var(--f-mono);color:var(--ink);font-size:13px}
.life.fresh p{color:var(--ink-2);max-width:40em;font-size:14.5px}
.life.fresh .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.adopt .btn[disabled]{opacity:.7;cursor:default}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-weight:400}
.opt:has(input:checked){border-color:var(--ink);background:var(--bg)}
.opt input{margin-top:5px;accent-color:var(--ink)}
.opt b{display:block;font-size:14px}
.opt small{display:block;color:var(--ink-2);font-size:12.5px;margin:2px 0 0!important;font-weight:400}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink-2);cursor:pointer}
.chk input{margin-top:4px;accent-color:var(--ink)}
.stack span{font-family:var(--f-mono);font-size:12.5px;padding:5px 11px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}

.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.box h3{font-size:13px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;margin-bottom:12px}
.act-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.counts{display:flex;justify-content:space-around;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);text-align:center}
.counts b{display:block;font-family:var(--f-mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.counts span{font-size:12px;color:var(--ink-2)}
.health{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);margin-top:12px}
.health i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.links{display:grid;gap:8px}
.person{display:flex;align-items:center;gap:12px;padding-block:6px}
.person a.n{font-weight:700;text-decoration:none}
.person a.n:hover{text-decoration:underline}
.person .r{font-size:12px;color:var(--ink-2)}
.person .grow{flex:1;min-width:0}
.evcard{display:flex;gap:12px;align-items:center;text-decoration:none}
.evcard canvas{width:84px;aspect-ratio:16/10;border-radius:8px;flex:none}
.evcard b{display:block;font-size:14px;line-height:1.4}
.evcard span{font-size:12px;color:var(--ink-2)}
.adopt{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.adopt h3{color:var(--accent)}
.adopt p{font-size:13.5px;line-height:1.7;margin-bottom:14px;opacity:.9}

.cmt-form{display:grid;gap:10px;margin-bottom:18px}
.cmt-form textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:12px 14px;font:inherit;resize:vertical}
.cmt-form textarea:focus{outline:none;border-color:var(--ink)}
.cmt-form .row{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--ink-3);font-size:12px}
.cmts{display:grid;gap:18px}
.cmt{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px}
.cmt .h{display:flex;gap:10px;align-items:baseline;font-size:13px}
.cmt .h a{font-weight:700;text-decoration:none}
.cmt .h span{color:var(--ink-3);font-size:12px}
.cmt p{font-size:14.5px;margin-top:2px}
.related{padding-block:56px 64px}

/* 赛事 */
.page-h{padding-block:40px 20px;display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}
.page-h h1{font-family:var(--f-display);font-weight:400;font-size:clamp(36px,4.6vw,56px);line-height:1.05}
.page-h p{color:var(--ink-2);margin-top:8px;max-width:40em}
.filters{display:grid;gap:4px;margin-bottom:22px;border-block:1px solid var(--line);padding-block:8px}
.frow{display:flex;gap:14px;align-items:center;min-width:0}
.frow > span{flex:none;width:44px;color:var(--ink-3);font-size:12.5px}
.frow .chips{padding-block:6px}

/* ---------- 赛后生命线 ---------- */
function lifeline(w){
 const e=EV[w.e],R=rng(hash(w.id+'h')),start=new Date(e.start.getTime()-14*DAY);
 const days=Math.round((now-start)/DAY)+1;
 if(days<=0)return null;
 const weeks=Math.min(60,Math.ceil(days/7)),cells=[];let total=0,last=-1;const aw=new Set();
 for(let i=0;i<weeks*7;i++){
  const day=new Date(start.getTime()+i*DAY),rel=Math.round((day-e.start)/DAY);
  if(day>now){cells.push({lv:-1});continue}
  let lv=0;const after=rel-e.len,wk=day.getDay()%6===0;
  if(rel<0)lv=R()<.06?1:0;
  else if(rel<e.len)lv=R()<.25?3:4;
  else if(w.s==='sleeping')lv=after<18?(R()<.45?1+Math.floor(R()*2):0):0;
  else if(w.s==='iterating')lv=R()<(wk?.25:.5)?1+Math.floor(R()*3):0;
  else if(w.s==='launched')lv=R()<(wk?.3:.55)?1+Math.floor(R()*(after<60?4:2.6)):0;
  else lv=R()<Math.min(.9,(wk?.2:.4)+after/300)?1+Math.floor(R()*4):0;
  cells.push({lv,ev:rel>=0&&rel<e.len});
  if(lv>0){total+=[0,2,4,8,15][lv]+Math.floor(R()*3);last=i;if(rel>=e.len)aw.add(Math.floor(i/7))}
 }
 const lastDay=new Date(start.getTime()+Math.max(0,last)*DAY),logs=w.s==='sleeping'?1+Math.floor(R()*3):4+Math.floor(R()*16);
 return{cells,weeks,total,logs,afterWeeks:aw.size,lastAgo:Math.max(0,Math.round((now-lastDay)/DAY)),start};
}
function lifeHTML(w){
 if(w.s==='unclaimed')return`<div class="life fresh"><p>作者认领并绑定代码仓库后，这里会开始记录每天的提交和开发日志。</p></div>`;
 if(w.fresh)return`<div class="life fresh"><p>还没有绑定代码仓库。绑定 GitHub 或 Gitee 仓库后，这里会开始记录每天的提交；硬件、设计这类提交少的作品，可以用开发日志记录进展。</p><div class="row"><button class="btn btn-ink btn-sm" data-act="bind">${ic.git}绑定代码仓库</button><button class="btn btn-sm" data-act="devlog">写一篇开发日志</button></div></div>`;
 const L=lifeline(w),e=EV[w.e];
 if(!L)return`<div class="life"><p style="color:var(--ink-2)">比赛还没开始，提交记录会在开赛后自动出现在这里。</p></div>`;
 const evCol=2;
 const ms=[[fmtF(e.start),`比赛 ${e.len*24} 小时内完成首版 Demo`],[fmtF(e.end),w.award?`Demo Day 获得「${w.award}」`:'Demo Day 完成路演']];
 const atE=n=>fmtF(new Date(e.end.getTime()+n*DAY));
 const lastT=fmtF(new Date(now.getTime()-L.lastAgo*DAY));
 if(w.s==='sleeping'){ms.push([lastT,'最后一次提交']);ms.push(['现在','作者开放接手，可以申请继续开发'])}
 else{if(diff(e.end)<-21)ms.push([atE(21),'发布 v0.2，开始收集用户反馈']);if((w.s==='launched'||w.s==='funded')&&diff(e.end)<-42)ms.push([atE(42),'正式上线']);if(w.s==='funded'&&diff(e.end)<-70)ms.push([atE(70),'获得投资（示例）']);ms.push([lastT,'最近一次提交'])}
 const lv=[0,1,2,3,4].map(i=>`<i class="${i?'l'+i:''}"></i>`).join('');
 return`<div class="life">
  <div class="life-stats">
   <div><b>${L.total.toLocaleString('en-US')}</b><span>累计提交</span></div>
   <div><b>${L.afterWeeks}</b><span>赛后活跃周数</span></div>
   <div><b>${L.logs}</b><span>开发日志</span></div>
   <div class="${L.lastAgo>60?'warn':''}"><b>${L.lastAgo===0?'今天':L.lastAgo+' 天前'}</b><span>最近一次提交</span></div>
   <div><b>${diff(e.end)>=0?'进行中':Math.abs(diff(e.end))+' 天'}</b><span>距离比赛结束</span></div>
  </div>
  <div class="heat-scroll"><div class="heat-box" style="--min:${L.weeks*10}px">
   <span class="ev-mark" style="left:${evCol/L.weeks*100}%">▼ 比赛 ${e.len*24}h</span>
   <div class="heat" role="img" aria-label="从赛前两周到今天的每日提交热力图">${L.cells.map(x=>`<i class="${x.lv<0?'fu':x.lv?'l'+x.lv:''}${x.ev?' ev':''}"></i>`).join('')}</div>
  </div></div>
  <div class="heat-axis"><span>${fmtF(L.start)} · 赛前两周</span><span class="legend">少 ${lv} 多</span><span>今天 ${fmtF(now)}</span></div>
  <ol class="tl">${ms.map((m,i)=>`<li class="${i===ms.length-1?'now':''}"><span class="d">${m[0]}</span><span class="dot"></span><span class="t">${esc(m[1])}</span></li>`).join('')}</ol>
 </div>`;
}

  <div class="ev-date"><b>${pad(e.start.getDate())}</b><span>${e.start.getFullYear()}.${pad(e.start.getMonth()+1)}</span></div>
  ${cvE(e,'16/9',480)}
  <div class="ev-info"><h3>${esc(e.name)}</h3>
   <div class="m"><span>${ic.pin}${e.form==='线上'?'线上':e.city}</span><span>${ic.clock}${e.len*24} 小时</span><span>${ic.users}${e.size} 人</span><span>${esc(e.org)}（示例）</span></div>
   <div class="tk">${e.tracks.map(t=>`<span>${esc(t)}</span>`).join('')}</div></div>
  <div class="ev-right"><span class="prize">${prizeT(e.prize)}</span><span class="pill ${s}"><i></i>${countdown(e)}</span>${s==='ended'?`<small>收录作品 ${n} 件</small>`:''}</div>
 </a>`}).join(''):'<div class="empty">没有符合条件的赛事，试试放宽筛选条件。</div>'}</div>
 </div>`;
}
function viewEvent(id){
 const e=EV[id];if(!e)return viewMissing();
 const s=evState(e),works=WORKS.filter(w=>w.e===e.id),R=rng(hash(e.id+'x'));
 const days=[];for(let d=0;d<e.len;d++)days.push(new Date(e.start.getTime()+d*DAY));
 const sched=[[days[0],'09:00','签到 · 开幕式'],[days[0],'10:00','开始开发',1],[days[0],'14:00','导师答疑开放'],[days[0],'20:00','中期检查'],[days[e.len-1],'10:00','停止提交代码',1],[days[e.len-1],'13:00','Demo Day 路演',1],[days[e.len-1],'17:00','颁奖 · 作品自动发布到口骇']];
 const per=Math.round(e.prize/e.tracks.length/10000*10)/10;
 const similar=WORKS.filter(w=>w.e!==e.id&&w.tags.some(t=>e.tags.includes(t))).slice(0,5);
 let worksSec;
 if(s==='ended')worksSec=`<section class="e-sec"><h2>本届作品<small>${works.length} 件 · 赛后仍在更新 ${works.filter(w=>ACTIVE.includes(w.s)).length} 件 · 待认领 ${works.filter(w=>w.s==='unclaimed').length} 件</small></h2>${works.length?`<div class="masonry">${works.map(card).join('')}</div>`:'<div class="empty">这场比赛的作品还在整理中。</div>'}</section>`;
 else if(s==='live')worksSec=`<section class="e-sec"><h2>作品提交中<small>还剩 ${Math.max(0,diff(e.end))+1} 天截止</small></h2><div class="note"><span>参赛者提交后，作品会在颁奖结束时自动公开，并开始记录赛后生命线。</span><button class="btn btn-y btn-sm" data-act="publish" data-ev="${e.id}">提交作品</button></div>${works.length?`<div class="masonry">${works.map(card).join('')}</div>`:''}</section>`;
 else worksSec=`<section class="e-sec"><h2>同主题往届作品<small>看看别人在这个方向上做过什么</small></h2><div class="masonry">${similar.map(card).join('')}</div></section>`;
 const reminded=has('remind',e.id);
 return`<div class="wrap">
 <nav class="crumb" aria-label="位置"><a href="#events">黑客松</a><span>/</span><span>${esc(e.name)}</span></nav>
 <div class="e-banner">${cvE(e,'21/7',1440)}</div>
 <div class="e-head">
  <div><span class="pill ${s}"><i></i>${EVS[s]} · ${countdown(e)}</span><h1>${esc(e.name)}</h1><p class="org">主办方：${esc(e.org)}（示例）</p></div>
  <div class="e-cta">
   ${s==='ended'?'':`<button class="btn btn-y" data-act="signup">${ic.ext}前往官方报名</button>`}
   <button class="btn ${reminded?'on':''}" data-act="remind" data-id="${e.id}">${ic.bell}${reminded?'已加入赛程':'加入我的赛程'}</button>
   ${s==='ended'?'':`<button class="btn" data-act="team">${ic.users}找队友</button>`}
  </div>
 </div>
 <div class="facts">
  <div class="fact"><span>比赛时间</span><b class="mono">${fmtD(e.start)} – ${fmtD(e.end)}</b></div>
  <div class="fact"><span>报名截止</span><b class="mono">${fmtF(e.signup)}</b></div>
  <div class="fact"><span>地点</span><b>${e.form==='线上'?'线上':e.city+' · 线下'}</b></div>
  <div class="fact"><span>奖金池</span><b class="mono">${prizeT(e.prize)}</b></div>
  <div class="fact"><span>规模</span><b class="mono">${e.size} 人</b></div>
  <div class="fact"><span>收藏赛程</span><b class="mono">${(120+Math.floor(R()*900)+(reminded?1:0)).toLocaleString('en-US')}</b></div>
 </div>
 <p class="src" style="margin-top:10px">来源：主办方报名页 · ${1+Math.floor(R()*5)} 小时前同步 · 字段由 AI 抽取并经人工核对 · <button data-act="fix">信息有误？</button></p>
 <div class="e-cols">
  <section class="e-sec"><h2>赛道</h2><div class="tracks">${e.tracks.map(t=>`<div class="track"><b>${esc(t)}</b><span>约 ¥${per} 万</span></div>`).join('')}</div></section>
  <section class="e-sec"><h2>日程<small>以主办方最终通知为准</small></h2><ol class="sched">${sched.map(x=>`<li class="${x[3]?'key':''}"><span class="mono">${fmtD(x[0])} ${x[1]}</span><b style="font-weight:${x[3]?700:500}">${x[2]}</b></li>`).join('')}</ol></section>
 </div>
 ${worksSec}
 <div style="height:64px"></div>
 </div>`;
}

/* ---------- 视图：个人主页 ---------- */
function viewUser(uid){
 const u=USERS[uid];if(!u)return viewMissing();
 const me=uid==='u1',ws=worksOf(uid),evs=userEvents(uid).sort((a,b)=>b.s-a.s);
 const awards=ws.filter(w=>w.award),lk=ws.reduce((s,w)=>s+likes(w),0);
 const SC=['#FFD400','#FF9E7A','#7FD1AE','#9DB4FF','#F7A1C4','#C9A7FF'];
 const stk=[...awards.map((w,i)=>`<span class="stk ${i%2?'tag':'round'}" style="--sc:${SC[i%SC.length]};--r:${[-6,4,-2,7][i%4]}deg">${esc(w.award)}<small>${esc(EV[w.e].short)}</small></span>`),
  `<span class="stk" style="--sc:#FFFFFF;--r:3deg">${evs.filter(e=>evState(e)==='ended').length} 场完赛</span>`,
  ws.some(w=>w.s!=='sleeping')?`<span class="stk tag" style="--sc:#7FD1AE;--r:-4deg">赛后仍在更新</span>`:'',
  `<span class="stk round" style="--sc:#15171C;color:#FFD400;--r:8deg">${u.city}<small style="color:#FFFFFF">${esc(u.role.split(' ')[0])}</small></span>`].join('');
 const tabs=[['works',`作品 ${ws.length}`],['trail','参赛足迹'],...(me?[['saved',`收藏 ${S.saved.length}`]]:[])];
 if(!me&&UI.pTab==='saved')UI.pTab='works';
 let body='';
 if(UI.pTab==='works')body=ws.length?`<div class="masonry">${ws.map(card).join('')}</div>`:'<div class="empty">还没有发布作品。</div>';
 if(UI.pTab==='trail')body=`<ol class="foot-tl">${evs.map(e=>{const w=ws.find(x=>x.e===e.id),st=evState(e),res=w?(w.award||'完赛'):(st==='ended'?'完赛':st==='live'?'比赛中':'已报名');return`<li><span class="mono">${fmtF(e.start)}</span><a href="#event-${e.id}">${esc(e.name)}</a>${w?`<a href="#work-${w.id}" style="font-weight:500">${esc(w.t)}</a>`:'<span style="color:var(--ink-3)">—</span>'}<span class="res ${w&&w.award?'win':''}">${res}</span></li>`}).join('')}</ol>`;
 if(UI.pTab==='saved'){const sv=S.saved.map(W).filter(Boolean);body=sv.length?`<div class="masonry">${sv.map(card).join('')}</div>`:'<div class="empty">还没有收藏作品。在作品页点「收藏」，会出现在这里。</div>'}
 const fol=has('follow',uid);
 return`<div class="p-banner wrap" style="padding-inline:0;max-width:1320px"><canvas data-cover data-kind="year" data-seed="${uid}" data-ar="6/1" data-w="1440" role="img" aria-label="${esc(u.n)} 过去一年的提交热力图"></canvas><span class="cap">过去 53 周的提交 · 亮格是比赛周</span></div>
 <div class="wrap">
  <div class="p-head">${av(uid,'xl')}
   <div class="p-name"><h1>${esc(u.n)}</h1><div class="h">@${u.h} · ${esc(u.city)}</div><div class="r">${esc(u.role)}</div></div>
   <div class="p-acts">${me?`<button class="btn btn-y" data-act="publish">发布作品</button><button class="btn" data-act="editp">编辑资料</button>`:`<button class="btn ${fol?'on':'btn-ink'}" data-act="follow" data-id="${uid}">${fol?'已关注':'关注'}</button><button class="btn" data-act="msg" data-id="${uid}">私信</button>`}</div>
  </div>
  <div class="p-bio">
   <div><p>${esc(u.bio)}</p>${u.open.length?`<div class="open">${u.open.map(o=>`<span>${esc(o)}</span>`).join('')}</div>`:''}</div>
   <div class="p-stats">
    <div><b>${evs.length}</b><span>参赛</span></div><div><b>${awards.length}</b><span>获奖</span></div><div><b>${ws.length}</b><span>作品</span></div><div><b>${fmtN(lk)}</b><span>获赞</span></div><div><b id="fans">${fmtN(u.fans+(fol?1:0))}</b><span>粉丝</span></div>
   </div>
  </div>
  <div class="stickers" aria-label="徽章">${stk}</div>
  <div class="tabs" role="tablist" style="margin-top:18px">${tabs.map(t=>`<button class="tab ${UI.pTab===t[0]?'on':''}" role="tab" aria-selected="${UI.pTab===t[0]}" data-act="ptab" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>
  <div style="padding-block:24px 64px">${body}</div>
 </div>`;
}
const viewMissing=()=>`<div class="wrap"><div class="empty" style="margin-block:64px">没有找到这个页面。<a href="#home">回到首页</a></div></div>`;

/* ---------- 路由 ---------- */
const app=document.getElementById('app');
let cur='';
function route(keepScroll){
 const h=(location.hash||'#home').slice(1);
 let html,nav='home';
 if(h.startsWith('work-'))html=viewWork(h.slice(5));
 else if(h==='events'){html=viewEvents();nav='events'}
 else if(h.startsWith('event-')){html=viewEvent(h.slice(6));nav='events'}
 else if(h.startsWith('user-')){const id=h.slice(5);if(cur!==h)UI.pTab='works';html=viewUser(id);nav=id==='u1'?'me':''}
 else{html=viewHome();nav=UI.tab==='wake'?'wake':'home'}
 app.innerHTML=html;
 document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===nav));
 if(!keepScroll&&cur!==h)window.scrollTo(0,0);
 cur=h;paint(app);
}
const rerender=()=>{const y=window.scrollY;route(true);window.scrollTo(0,y)};
window.addEventListener('hashchange',()=>route());

/* ---------- 交互 ---------- */
const toastEl=document.getElementById('toast');let tt;
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('show'),2200)}
const qIn=document.getElementById('q');
qIn.addEventListener('input',()=>{UI.q=qIn.value.trim();if(!cur.startsWith('home')&&cur!==''){location.hash='#home';return}const f=document.getElementById('feed');if(f){f.innerHTML=feedHTML();paint(f)}});

document.addEventListener('click',ev=>{
 const t=ev.target.closest('[data-act]');if(!t)return;
 const a=t.dataset.act,id=t.dataset.id;
 if(t.tagName==='A'&&a!=='gotab')ev.preventDefault();
 switch(a){
  case'tab':UI.tab=t.dataset.tab;rerender();break;
  case'gotab':ev.preventDefault();UI.tab=t.dataset.tab;UI.track='全部';if(location.hash!=='#home'&&location.hash!=='')location.hash='#home';else route();if(UI.tab==='wake')setTimeout(()=>{const f=document.querySelector('.feed');f&&f.scrollIntoView({behavior:'smooth'})},30);break;
  case'track':UI.track=t.dataset.v;rerender();break;
  case'clearq':UI.q='';qIn.value='';rerender();break;
  case'evf':UI[t.dataset.k]=t.dataset.v;rerender();break;
  case'ptab':UI.pTab=t.dataset.tab;rerender();break;
  case'like':{const on=toggle('liked',id);toast(on?'已喜欢，作者会收到通知':'已取消喜欢');rerender();break}
  case'save':{const on=toggle('saved',id);toast(on?'已收藏，可在「我的主页 · 收藏」找到':'已取消收藏');rerender();break}
  case'follow':{const on=toggle('follow',id);toast(on?`已关注 ${USERS[id].n}，Ta 发布新作品时会通知你`:`已取消关注 ${USERS[id].n}`);rerender();break}
  case'remind':{const on=toggle('remind',id);toast(on?'已加入赛程，开赛和截止前一天会提醒你':'已从赛程中移除');rerender();break}
  case'demo':toast(W(id).s==='sleeping'?'原型：存档快照暂未接入':'原型：在线 Demo 暂未接入');break;
  case'repo':toast('原型：代码仓库链接暂未接入');break;
  case'adopt':toast('已提交接手申请，作者会在 7 天内回复（原型演示）');break;
  case'join':toast('已向团队发送加入申请（原型演示）');break;
  case'signup':toast('原型：将跳转到主办方官方报名页');break;
  case'team':toast('原型：组队广场还在设计中');break;
  case'tip':toast('原型：线索表单还在设计中');break;
  case'fix':toast('感谢纠错，编辑会在 24 小时内核实（原型演示）');break;
  case'msg':toast(`原型：私信 ${USERS[id].n} 的功能还在设计中`);break;
  case'editp':toast('原型：资料编辑还在设计中');break;
  case'publish':openPub(t.dataset.ev);break;
  case'claim':openClaim(id);break;
  case'close-claim':claimDlg.close();break;
  case'takedown':toast('已收到申请，核实前先隐藏这份档案（原型演示）');break;
  case'bind':toast('原型：将跳转到 GitHub / Gitee 授权页');break;
  case'devlog':toast('原型：开发日志编辑器还在设计中');break;
  case'close':dlg.close();break;
 }
});
document.addEventListener('submit',ev=>{
 if(ev.target.id!=='cmt-form')return;ev.preventDefault();
 const ta=document.getElementById('cmt-in'),v=ta.value.trim(),id=ev.target.dataset.id;
 if(!v){ta.focus();toast('先写点什么再发表');return}
 (S.comments[id]=S.comments[id]||[]).push({t:v});save();ta.value='';toast('评论已发表');rerender();
});

/* ---------- 发布作品 ---------- */
const dlg=document.getElementById('pub'),form=document.getElementById('pub-form'),err=document.getElementById('pf-err');
const KINDS=[['chat','对话'],['dash','看板'],['mobile','App'],['map','地图'],['hardware','硬件'],['game','游戏'],['terminal','终端']];
document.getElementById('pf-cov').innerHTML=KINDS.map((k,i)=>`<label><input type="radio" name="pf-cov" id="pf-cov-${k[0]}" value="${k[0]}"${i===0?' checked':''}><canvas data-cover data-kind="${k[0]}" data-pal="${[0,6,7,4,1,5,3][i]}" data-seed="pick${i}" data-title="新作品" data-ar="1/1" data-w="360"></canvas>${k[1]}</label>`).join('');
function openPub(evId){
 const sel=document.getElementById('pf-event');
 sel.innerHTML=EVL.filter(e=>evState(e)==='ended'||evState(e)==='live').sort((a,b)=>b.s-a.s).map(e=>`<option value="${e.id}"${e.id===evId?' selected':''}>${esc(e.name)}</option>`).join('');
 err.hidden=true;
 if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');
 paint(dlg);
 setTimeout(()=>document.getElementById('pf-title').focus(),30);
}
form.addEventListener('submit',ev=>{
 ev.preventDefault();
 const t=document.getElementById('pf-title').value.trim(),tag=document.getElementById('pf-tag').value.trim();
 if(!t||!tag){err.textContent=!t?'请填写作品名':'请写一句话介绍，让人知道它是做什么的';err.hidden=false;return}
 const e=document.getElementById('pf-event').value,s=document.getElementById('pf-status').value,cov=(form.querySelector('input[name="pf-cov"]:checked')||{}).value||'chat';
 const lic=document.getElementById('pf-license').value;
 if(s==='sleeping'&&lic==='保留所有权利'){err.textContent='开放接手的作品不能选「保留所有权利」，请换一个允许继续开发的协议';err.hidden=false;return}
 const stack=document.getElementById('pf-stack').value.split(/[,，、]/).map(x=>x.trim()).filter(Boolean);
 const ki=KINDS.findIndex(k=>k[0]===cov);
 const w={id:'m'+Date.now().toString(36),t,tag,a:['u1'],e,award:'',s,cov,pal:[0,6,7,4,1,5,3][ki]||0,ar:'4/3',likes:0,views:1,tags:EV[e].tags.slice(),stack:stack.length?stack:['未填写'],
  lic,fresh:true,p:tag,so:'作者还没有补充方案细节。',af:s==='sleeping'?'作者开放接手，欢迎联系。':'刚刚发布，作者会在这里持续记录进展。',created:1};
 WORKS.unshift(w);S.mine.push(w);save();
 form.reset();document.getElementById('pf-cov-chat').checked=true;dlg.close();
 location.hash='#work-'+w.id;toast('作品已发布，赛后生命线开始记录');
});

/* ---------- 认领作品 ---------- */
const claimDlg=document.getElementById('claim'),claimForm=document.getElementById('claim-form'),cvErr=document.getElementById('cv-err');
function openClaim(id){
 const w=W(id);if(!w)return;
 claimDlg.dataset.id=id;claimForm.reset();cvErr.hidden=true;
 document.getElementById('claim-name').textContent=`「${w.t}」· ${EV[w.e].name} · ${w.team} 人团队`;
 if(claimDlg.showModal)claimDlg.showModal();else claimDlg.setAttribute('open','');
}
claimForm.addEventListener('submit',ev=>{
 ev.preventDefault();
 if(!document.getElementById('cv-ok').checked){cvErr.textContent='请先勾选确认，你是这件作品的团队成员';cvErr.hidden=false;return}
 const id=claimDlg.dataset.id,way=(claimForm.querySelector('input[name="cv"]:checked')||{}).value;
 if(way==='org'){if(!has('pending',id))toggle('pending',id);claimDlg.close();rerender();toast('已提交给主办方核对，通过后会通知你（原型演示）');return}
 S.claimed.push(id);save();applyClaim(id);claimDlg.close();rerender();toast('认领成功，作品已进入你的主页（原型演示：跳过了仓库授权）');
});

route();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{document.querySelectorAll('canvas[data-done]').forEach(c=>c.removeAttribute('data-done'));paint()});
})();
</script>
